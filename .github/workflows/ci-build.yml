name: CI Build Check

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: ['feat/**', 'fix/**']

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t backend-test ./backend

      - name: Smoke test backend
        run: |
          docker run -d --name backend-smoke -p 8081:8081 \
            -e ENABLE_CACHE=false \
            backend-test
          # Wait for startup (model loading takes a few seconds)
          sleep 15
          curl -f http://localhost:8081/health
          docker stop backend-smoke

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      # Also checks that the frontend knows every lever of every model, so a
      # model bump PR that adds a lever fails here and not in production.
      - name: Run backend tests
        working-directory: backend
        run: uv run pytest
