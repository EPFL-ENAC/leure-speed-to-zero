name: Bump transition-compass-model version

on:
  repository_dispatch:
    types: [model-updated]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Model version tag (e.g., v1.2.3)'
        required: true

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.LEURE_SPEED_TO_ZERO_BUMP_MODEL_TOKEN }}
          ref: dev

      - name: Get tag
        id: tag
        run: |
          TAG=${{ github.event.client_payload.tag || github.event.inputs.tag }}
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Pin new version in pyproject.toml
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          sed -i "s/transition-compass-model[^\"']*/transition-compass-model==${TAG#v}/" backend/pyproject.toml

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Regenerate lock file
        run: cd backend && uv lock

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.LEURE_SPEED_TO_ZERO_BUMP_MODEL_TOKEN }}
          commit-message: "chore: bump transition-compass-model to ${{ steps.tag.outputs.tag }}"
          title: "chore: bump transition-compass-model to ${{ steps.tag.outputs.tag }}"
          body: |
            Automated version bump of `transition-compass-model` to `${{ steps.tag.outputs.tag }}`.

            **Changes:**
            - `backend/pyproject.toml` — version pinned to `${{ steps.tag.outputs.tag }}`
            - `backend/uv.lock` — regenerated with new PyPI release

            Review the diff and merge to deploy the new model version.
          branch: "chore/bump-model-${{ steps.tag.outputs.tag }}"
          base: dev
          labels: dependencies
