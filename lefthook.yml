# RC file to ensure proper PATH for npm/npx
rc: ./.lefthookrc

# Without this the generated hook exits quietly when it cannot find lefthook in
# the checkout, and commits run no checks at all. A git worktree needs its own
# root `npm ci` (scripts/wt-setup.sh does it).
assert_lefthook_installed: true

# commit-msg:
#   commands:
#     commitlint:
#       run: npx --no -- commitlint --edit {1}

# EXAMPLE USAGE:
#
#   Refer for explanation to following link:
#   https://github.com/evilmartians/lefthook/blob/master/docs/configuration.md
#
# pre-push:
#   commands:
#     eslint-audit:
#       tags: frontend eslint
#       run: npm run lint
#     typescript-audit:
#       tags: frontend typescript
#       run: npm run type-check

pre-commit:
  parallel: true
  commands:
    # Format frontend files (JS, TS, Vue, JSON, etc.) and root files
    prettier-format:
      glob: "*.{js,ts,jsx,tsx,vue,json,css,scss,md,yml,yaml}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
      tags: format
    # Lint frontend files
    eslint-lint:
      root: "frontend/"
      glob: "*.{js,ts,vue}"
      run: npm run lint -- {staged_files}
      tags: lint frontend
    # Format backend Python files
    ruff-format:
      root: "backend/"
      glob: "*.py"
      run: uv run --no-sync ruff format {staged_files}
      stage_fixed: true
      tags: format backend
    # Lint backend Python files
    ruff-lint:
      root: "backend/"
      glob: "*.py"
      run: uv run --no-sync ruff check {staged_files}
      tags: lint backend

# No pre-push section on purpose. The worktree push guard used to live here, but
# lefthook decides a push "has no matching files" and skips the job — it did that
# on a real `git push origin HEAD:dev`, and a guard that can be skipped is not a
# guard. scripts/wt-setup.sh installs it as a plain .git/hooks/pre-push instead,
# chaining whatever hook was there before. Keeping pre-push out of this file is
# what stops `lefthook install` from replacing it.
