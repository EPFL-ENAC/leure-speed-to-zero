# RC file to ensure proper PATH for npm/npx
rc: ./.lefthookrc

# commit-msg:
#   commands:
#     commitlint:
#       run: npx --no -- commitlint --edit {1}

# EXAMPLE USAGE:
#
#   Refer for explanation to following link:
#   https://github.com/evilmartians/lefthook/blob/master/docs/configuration.md
#
# pre-push:
#   commands:
#     eslint-audit:
#       tags: frontend eslint
#       run: npm run lint
#     typescript-audit:
#       tags: frontend typescript
#       run: npm run type-check

pre-commit:
  parallel: true
  commands:
    # Format frontend files (JS, TS, Vue, JSON, etc.) and root files
    prettier-format:
      glob: "*.{js,ts,jsx,tsx,vue,json,css,scss,md,yml,yaml}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
      tags: format
    # Lint frontend files
    eslint-lint:
      root: "frontend/"
      glob: "*.{js,ts,vue}"
      run: npm run lint -- {staged_files}
      tags: lint frontend
    # Format backend Python files
    ruff-format:
      root: "backend/"
      glob: "*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true
      tags: format backend
    # Lint backend Python files
    ruff-lint:
      root: "backend/"
      glob: "*.py"
      run: uv run ruff check {staged_files}
      tags: lint backend
